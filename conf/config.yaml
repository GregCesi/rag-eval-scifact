# Config Hydra par défaut — reproduit v1-dense à l'identique.
# Une stratégie se déclare en dérivant ou en surchargeant ces clés, jamais en
# modifiant le pipeline. Override CLI : `python -m rag_eval_scifact.run_campaign top_k=10`.

defaults:
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

campagne: v1-rejeu
run_name: baseline

retriever:
  name: dense
  model: sentence-transformers/all-MiniLM-L6-v2
  max_seq_length: 256
  dim: 384
  # Unité du retrieval (EXE-92) : "document" (défaut, reproduit v1 à l'identique)
  # ou "passages" — chaque document se découpe en fenêtres de chunk_size tokens
  # avec chunk_overlap de chevauchement, puis se regroupe au niveau document
  # (grouping : "max" ou "sum", grouping_top_n borne le "sum").
  unit: document
  chunk_size: 128
  chunk_overlap: 32
  grouping: max
  grouping_top_n: 1000
  # BM25 (EXE-93) : valeurs de configuration, jamais câblées en dur ; défauts
  # Elasticsearch (choix du chat, H2).
  bm25_k1: 1.2
  bm25_b: 0.75
  # Hybride dense + BM25 (EXE-95), actifs seulement si retriever.name=hybrid.
  # fusion_mode : "union" (alternance simple) ou "rrf" (Reciprocal Rank
  # Fusion). rrf_k : constante k du RRF (défaut usuel de la littérature, H2).
  fusion_mode: union
  rrf_k: 60
  # Instruction préfixée aux requêtes avant encodage (EXE-94 critère 2) ; jamais
  # aux documents. Chaîne vide (défaut, MiniLM) : aucun préfixe, v1 inchangé.
  query_instruction: ""
  # Taille de lot de l'encodage (EXE-94 H7) : 64 reproduit v1 (MiniLM, textes
  # courts) ; un modèle à fenêtre longue (Qwen) sature la mémoire à cette
  # taille sur les documents longs — abaissé à 8 dans ses combinaisons.
  batch_size: 64
  # Double encodeur (EXE-140, H2 : MedCPT) : modèle distinct pour les
  # requêtes, avec sa propre fenêtre. Vide/0 (défaut) : requêtes et documents
  # partagent `model`/`max_seq_length`, comportement inchangé.
  query_model: ""
  query_max_seq_length: 0
  # Stratégie de pooling (EXE-140) : "mean" (défaut, délégué à
  # sentence-transformers — MiniLM, Qwen) ou "cls" (premier jeton, modèle
  # `transformers` brut sans config sentence-transformers — MedCPT, H2).
  pooling: mean
  # Texte qui sert à chercher (EXE-141, HyDE) : "claim" (défaut, inchangé,
  # l'affirmation) ou "hyde" — remplacé par le faux résumé rédigé
  # (`results/v4-leviers/hyde.json`), sans `query_instruction` (c'est un
  # texte de document, pas une question instruite).
  query_source: claim

fusion: null
# Reranker cross-encoder (EXE-96) : relit chaque (claim, document) ensemble
# pour reclasser les `top_n` premiers documents d'un classement déjà construit.
# `name` : "none" (défaut, aucun reclassement) ou "cross-encoder" ; `model` et
# `top_n` ne s'appliquent qu'à "cross-encoder". `rerank=null` (grille v2-grid,
# variantes "sans-reranker") a le même effet que `rerank.name=none`.
rerank:
  name: none
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 100
  # Instruction passée au reranker à la place de son instruction par défaut
  # (EXE-157 critère 5 ; prompt du `CrossEncoder` — Qwen3-Reranker). Chaîne
  # vide (défaut) : aucun prompt n'est passé, comportement inchangé pour les
  # rerankers sans notion d'instruction (MiniLM, bge, MedCPT).
  instruction: ""
  # Charge le modèle en demi-précision (EXE-157 critère 6) : nécessaire pour
  # un gros reranker (Qwen3-Reranker-4B, ~16 Go en pleine précision) sur une
  # machine à mémoire limitée. Faux (défaut) : chargement en pleine précision,
  # comportement inchangé.
  half_precision: false
  # Taille de lot envoyée à `CrossEncoder.predict` (EXE-159 critère 3). 32
  # reproduit le défaut actuel de sentence-transformers : comportement
  # inchangé pour v2-grid, v4-leviers et les cinq runs déjà faits de
  # v5-rerankers, qui ne posent pas cette clé.
  batch_size: 32
split: test
top_k: 100

# Une trace MLflow par requête (claim, top-10 remonté, docs attendus, rang du
# premier attendu dans le top 100). Désactivable : avec tracing=false, le run
# n'écrit aucune trace (EXE-89).
tracing: true

# Cache des calculs lourds (embeddings de documents, classement de premier étage),
# hors du dépôt. Rangé par dataset_hash, modèle et fenêtre : changer l'un des trois
# ne réutilise jamais l'entrée d'un autre.
cache_dir: ~/.cache/rag-eval-scifact

hydra:
  run:
    dir: .
  # Le sweep (--multirun) garde le découpage par date/heure de Hydra, isolé sous
  # multirun/ (gitignored) : ses artefacts de bookkeeping (multirun.yaml) ne
  # polluent jamais la racine du dépôt. `job.chdir: false` fait que les
  # artefacts applicatifs (results/, RESULTS.md) s'écrivent quand même depuis
  # le cwd réel, jamais sous multirun/.
  output_subdir: null
  job:
    chdir: false
