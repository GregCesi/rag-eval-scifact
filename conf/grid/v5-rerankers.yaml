# Grille v5-rerankers (EXE-157) : six combinaisons, même recherche que
# `qwen3-passages-reference` de `conf/grid/v4-leviers.yaml`, clé pour clé —
# seul le reranker change. Les cinq rerankers relisent les 20 premiers
# documents du classement de premier étage (contre 100 dans v2-grid). Les
# deux rerankers Qwen3-Reranker reçoivent une instruction explicite (critère
# 5) ; les trois autres n'en reçoivent aucune. Le reranker Qwen3-Reranker-4B
# charge son modèle en demi-précision (critère 6).
runs:
  - run_name: qwen3-passages-sans-reranker
    overrides:
      - retriever.name=dense
      - retriever.model=Qwen/Qwen3-Embedding-0.6B
      - retriever.max_seq_length=2048
      - retriever.unit=passages
      - retriever.chunk_size=128
      - retriever.chunk_overlap=32
      - retriever.batch_size=8
      - "retriever.query_instruction='Instruct: Given a scientific claim, retrieve documents that support or refute it. Query: '"
      - rerank=null
  - run_name: rerank-minilm-top20
    overrides:
      - retriever.name=dense
      - retriever.model=Qwen/Qwen3-Embedding-0.6B
      - retriever.max_seq_length=2048
      - retriever.unit=passages
      - retriever.chunk_size=128
      - retriever.chunk_overlap=32
      - retriever.batch_size=8
      - "retriever.query_instruction='Instruct: Given a scientific claim, retrieve documents that support or refute it. Query: '"
      - rerank.name=cross-encoder
      - rerank.model=cross-encoder/ms-marco-MiniLM-L-6-v2
      - rerank.top_n=20
  - run_name: rerank-bge-m3-top20
    overrides:
      - retriever.name=dense
      - retriever.model=Qwen/Qwen3-Embedding-0.6B
      - retriever.max_seq_length=2048
      - retriever.unit=passages
      - retriever.chunk_size=128
      - retriever.chunk_overlap=32
      - retriever.batch_size=8
      - "retriever.query_instruction='Instruct: Given a scientific claim, retrieve documents that support or refute it. Query: '"
      - rerank.name=cross-encoder
      - rerank.model=BAAI/bge-reranker-v2-m3
      - rerank.top_n=20
  - run_name: rerank-medcpt-top20
    overrides:
      - retriever.name=dense
      - retriever.model=Qwen/Qwen3-Embedding-0.6B
      - retriever.max_seq_length=2048
      - retriever.unit=passages
      - retriever.chunk_size=128
      - retriever.chunk_overlap=32
      - retriever.batch_size=8
      - "retriever.query_instruction='Instruct: Given a scientific claim, retrieve documents that support or refute it. Query: '"
      - rerank.name=cross-encoder
      - rerank.model=ncbi/MedCPT-Cross-Encoder
      - rerank.top_n=20
  - run_name: rerank-qwen3-0.6b-top20
    overrides:
      - retriever.name=dense
      - retriever.model=Qwen/Qwen3-Embedding-0.6B
      - retriever.max_seq_length=2048
      - retriever.unit=passages
      - retriever.chunk_size=128
      - retriever.chunk_overlap=32
      - retriever.batch_size=8
      - "retriever.query_instruction='Instruct: Given a scientific claim, retrieve documents that support or refute it. Query: '"
      - rerank.name=cross-encoder
      - rerank.model=Qwen/Qwen3-Reranker-0.6B
      - rerank.top_n=20
      - "rerank.instruction='Given a scientific claim, retrieve documents that support or refute it'"
  - run_name: rerank-qwen3-4b-top20
    overrides:
      - retriever.name=dense
      - retriever.model=Qwen/Qwen3-Embedding-0.6B
      - retriever.max_seq_length=2048
      - retriever.unit=passages
      - retriever.chunk_size=128
      - retriever.chunk_overlap=32
      - retriever.batch_size=8
      - "retriever.query_instruction='Instruct: Given a scientific claim, retrieve documents that support or refute it. Query: '"
      - rerank.name=cross-encoder
      - rerank.model=Qwen/Qwen3-Reranker-4B
      - rerank.top_n=20
      - "rerank.instruction='Given a scientific claim, retrieve documents that support or refute it'"
      - rerank.half_precision=true
